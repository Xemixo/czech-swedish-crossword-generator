[package]
name        = "crossword_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "cwgen"
path = "src/main.rs"

[dependencies]
crossword_core = { path = "../crossword_core" }
clap           = { workspace = true }
